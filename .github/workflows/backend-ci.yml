name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["backend-image-*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tagged commit
        id: revision
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/backend-image-')
        shell: bash
        run: |
          set -Eeuo pipefail
          commit_sha=$(git rev-parse --verify "${GITHUB_REF}^{commit}")
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$commit_sha" = "$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend and development dependencies
        run: >-
          python -m pip install
          -r backend/requirements.txt
          -c backend/constraints-py311.txt
          -r backend/requirements-dev.txt

      - name: Typecheck backend
        working-directory: backend
        run: python -m mypy --config-file mypy.ini

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 backend image
        shell: bash
        run: |
          set -Eeuo pipefail

          paths=(
            backend/.env
            backend/.env.local
            backend/.dockerignore-fixture
            backend/.dockerignore-fixture/.env
            backend/.dockerignore-fixture/.env.production
          )
          for path in "${paths[@]}"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "Fixture path already exists: $path" >&2
              exit 1
            fi
          done

          mkdir -- backend/.dockerignore-fixture
          created_files=()
          cleanup() {
            result=$?
            trap - EXIT
            if ((${#created_files[@]})); then
              if ! rm -f -- "${created_files[@]}"; then
                echo "Could not remove all fixture files." >&2
                result=1
              fi
            fi
            if ! rmdir -- backend/.dockerignore-fixture; then
              echo "Could not remove fixture directory." >&2
              result=1
            fi
            exit "$result"
          }
          trap cleanup EXIT

          fixture_files=(
            backend/.env
            backend/.env.local
            backend/.dockerignore-fixture/.env
            backend/.dockerignore-fixture/.env.production
          )
          for path in "${fixture_files[@]}"; do
            if (set -o noclobber; : > "$path"); then
              created_files+=("$path")
              printf '%s\n' 'synthetic-dockerignore-fixture-not-a-secret' > "$path"
            else
              echo "Could not safely create fixture: $path" >&2
              exit 1
            fi
          done

          for path in "${fixture_files[@]}"; do
            if ! test -f "$path"; then
              echo "Fixture is missing: $path" >&2
              exit 1
            fi
          done
          docker buildx build --platform linux/amd64 --load \
            -t bike-route-map-backend:ci ./backend

          docker run --rm --entrypoint sh bike-route-map-backend:ci -c '
            for path in /app/.env /app/.env.local \
              /app/.dockerignore-fixture/.env \
              /app/.dockerignore-fixture/.env.production; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                echo "Fixture unexpectedly present in image: $path" >&2
                exit 1
              fi
              echo "Fixture absent from image: $path"
            done
          '

      - name: Start container and verify root endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          container_name="bike-route-map-backend-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            result=$?
            trap - EXIT

            if [ "$result" -ne 0 ] && docker container inspect "$container_name" >/dev/null 2>&1; then
              echo "Container logs after failed verification:" >&2
              docker logs "$container_name" || echo "Could not read container logs." >&2
            fi

            if docker container inspect "$container_name" >/dev/null 2>&1; then
              if ! docker stop --time 5 "$container_name" >/dev/null; then
                echo "Could not stop the verification container." >&2
                result=1
              fi
              if ! docker rm "$container_name" >/dev/null; then
                echo "Could not remove the verification container." >&2
                result=1
              fi
            fi

            exit "$result"
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:8001:8000 \
            bike-route-map-backend:ci

          CONTAINER_NAME="$container_name" python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          name = os.environ["CONTAINER_NAME"]
          deadline = time.monotonic() + 30
          last_error = "no response"
          ready = False

          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  break

              try:
                  running = subprocess.run(
                      ["docker", "inspect", "--format", "{{.State.Running}}", name],
                      check=True,
                      capture_output=True,
                      text=True,
                      timeout=min(2, remaining),
                  ).stdout.strip()
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                  print(f"Could not inspect verification container: {type(exc).__name__}", file=sys.stderr)
                  raise SystemExit(1)

              if running != "true":
                  print("Verification container exited before becoming ready.", file=sys.stderr)
                  raise SystemExit(1)

              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  break

              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8001/",
                      timeout=min(2, remaining),
                  ) as response:
                      body = response.read()
                      status = response.status
              except urllib.error.HTTPError as exc:
                  print(f"GET / returned HTTP {exc.code}.", file=sys.stderr)
                  raise SystemExit(1)
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  last_error = type(exc).__name__
                  time.sleep(min(0.5, max(0, deadline - time.monotonic())))
                  continue

              if time.monotonic() >= deadline:
                  break

              if status != 200:
                  print(f"GET / returned HTTP {status}, expected 200.", file=sys.stderr)
                  raise SystemExit(1)

              try:
                  payload = json.loads(body)
              except (json.JSONDecodeError, UnicodeDecodeError):
                  print("GET / returned invalid JSON.", file=sys.stderr)
                  raise SystemExit(1)

              if payload != {"message": "Welcome to the Bike Route API"}:
                  print("GET / returned an unexpected JSON response.", file=sys.stderr)
                  raise SystemExit(1)

              print("Container is ready: GET / returned HTTP 200 and the expected JSON.")
              ready = True
              break

          if not ready:
              print(f"Container did not become ready within 30 seconds ({last_error}).", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Save verified image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/backend-image-')
        run: docker save -o "$RUNNER_TEMP/backend-image.tar" bike-route-map-backend:ci

      - name: Upload verified image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/backend-image-')
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/backend-image-')
    needs: backend
    runs-on: ubuntu-latest
    concurrency:
      group: backend-image-${{ needs.backend.outputs.commit_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}

      - name: Load verified image
        run: docker load -i "$RUNNER_TEMP/backend-image.tar"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish image by commit SHA
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.backend.outputs.commit_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          image="ghcr.io/voxelprincess/bike-route-map-backend:$COMMIT_SHA"

          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          repository = "voxelprincess/bike-route-map-backend"
          commit_sha = os.environ["COMMIT_SHA"]
          credentials = f'{os.environ["GITHUB_ACTOR"]}:{os.environ["GHCR_TOKEN"]}'
          basic = base64.b64encode(credentials.encode()).decode()
          query = urllib.parse.urlencode({
              "service": "ghcr.io",
              "scope": f"repository:{repository}:pull",
          })
          token_request = urllib.request.Request(
              f"https://ghcr.io/token?{query}",
              headers={"Authorization": f"Basic {basic}"},
          )
          with opener.open(token_request, timeout=30) as response:
              token = json.load(response)["token"]

          manifest_request = urllib.request.Request(
              f"https://ghcr.io/v2/{repository}/manifests/{commit_sha}",
              method="HEAD",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": ", ".join((
                      "application/vnd.oci.image.index.v1+json",
                      "application/vnd.oci.image.manifest.v1+json",
                      "application/vnd.docker.distribution.manifest.list.v2+json",
                      "application/vnd.docker.distribution.manifest.v2+json",
                  )),
              },
          )
          try:
              with opener.open(manifest_request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"Unexpected manifest HTTP status: {response.status}")
                  print("Commit SHA tag already exists; refusing to overwrite it.", file=sys.stderr)
                  raise SystemExit(1)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("Commit SHA tag does not exist; publication may proceed.")
          PY

          docker tag bike-route-map-backend:ci "$image"
          docker push "$image" | tee "$RUNNER_TEMP/backend-push.log"
          digest=$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' "$RUNNER_TEMP/backend-push.log" | tail -n 1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable="ghcr.io/voxelprincess/bike-route-map-backend@$digest"
          echo "Image: $image"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Digest: $digest"
          echo "Immutable reference: $immutable"
          {
            printf '**Image:** `%s`\n\n' "$image"
            printf '**Commit SHA:** `%s`\n\n' "$COMMIT_SHA"
            printf '**Digest:** `%s`\n\n' "$digest"
            printf '**Immutable reference:** `%s`\n' "$immutable"
          } >> "$GITHUB_STEP_SUMMARY"
